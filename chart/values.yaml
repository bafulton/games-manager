image:
  repository: ghcr.io/bafulton/games-manager
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

# One replica is plenty. Leader election keeps a rollout from running two
# controllers at once, which could hand two servers the same slot.
leaderElection: true

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

podAnnotations: {}
podLabels: {}
