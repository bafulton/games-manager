name: E2E Tests

# Installs the Helm chart into a Kind cluster and runs a real game server
# through it. On main, Release Please calls this and releases only once it
# passes.
on:
  pull_request:
  workflow_call:

jobs:
  test-e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KIND_VERSION: v0.33.0
      E2E_IMAGE: example.com/games-manager:e2e
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install kind
        run: |
          curl -fsSLo ./kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - uses: azure/setup-helm@v5.1.0
        with:
          version: v4.3.1

      # Built here, with a layer cache, rather than by the suite's plain
      # docker build: the uncached build was half the job.
      - uses: docker/setup-buildx-action@v4
      - name: Build the controller image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.E2E_IMAGE }}
          provenance: false
          cache-from: type=gha,scope=e2e
          cache-to: type=gha,mode=max,scope=e2e

      - name: Run e2e tests
        env:
          E2E_SKIP_IMAGE_BUILD: "true"
        run: make test-e2e
