name: E2E Tests

# Installs the Helm chart into a Kind cluster and runs a real game server
# through it. On main, Release Please calls this and releases only once it
# passes.
on:
  pull_request:
  workflow_call:

jobs:
  test-e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KIND_VERSION: v0.33.0
      E2E_IMAGE: example.com/games-manager:e2e
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # setup-go's cache is one entry shared by every job and saved by
          # whichever finishes first, so it never holds this job's
          # cross-compiled packages. This job keeps its own below.
          cache: false

      # Restored on every run; saved only from main, so pull requests reuse
      # main's build cache without paying to upload their own.
      - name: Restore Go build cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-e2e-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-e2e-${{ hashFiles('go.sum') }}-
            go-e2e-

      - name: Install kind
        run: |
          curl -fsSLo ./kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - uses: azure/setup-helm@v5.1.0
        with:
          version: v4.3.1

      # Compiled on the runner, with this job's Go build cache; the
      # image build only copies the binary in.
      - name: Build the controller image
        run: |
          make build-linux LINUX_ARCHES=amd64
          docker build -t "$E2E_IMAGE" .

      # Calls the suite directly: Lint and Tests already regenerate, format
      # and vet, which make test-e2e would repeat.
      - name: Run e2e tests
        env:
          E2E_SKIP_IMAGE_BUILD: "true"
          KIND_CLUSTER: games-manager-test-e2e
        run: |
          kind create cluster --name "$KIND_CLUSTER"
          go test ./test/e2e/ -v -ginkgo.v

      - name: Save Go build cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-e2e-${{ hashFiles('go.sum') }}-${{ github.sha }}
