name: Release

# Pushing a tag like v0.1.0 publishes the image as
# ghcr.io/bafulton/games-manager:0.1.0 and the chart as
# oci://ghcr.io/bafulton/charts/games-manager, version 0.1.0.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read version
        id: meta
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reject an existing image tag
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/games-manager:${{ steps.meta.outputs.version }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" > "$RUNNER_TEMP/inspect" 2>&1; then
            echo "::error::$IMAGE already exists; refusing to replace a released image"
            exit 1
          fi
          grep -Eqi 'not found|manifest unknown|name unknown' "$RUNNER_TEMP/inspect" || {
            cat "$RUNNER_TEMP/inspect"
            echo "::error::could not verify whether $IMAGE exists"
            exit 1
          }

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/games-manager:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/games-manager:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: azure/setup-helm@v5.1.0
        with:
          version: v4.3.1

      - name: Package and push chart
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$REGISTRY_PASSWORD" | helm registry login ghcr.io -u "$REGISTRY_USER" --password-stdin
          helm package chart --version "$VERSION" --app-version "$VERSION" -d "$RUNNER_TEMP"
          helm push "$RUNNER_TEMP/games-manager-$VERSION.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"
