name: Release

# Publishes version X.Y.Z as the image ghcr.io/bafulton/games-manager:X.Y.Z
# and the chart oci://ghcr.io/bafulton/charts/games-manager, version X.Y.Z.
#
# Release Please calls this when its release PR merges. It has no tag
# trigger: the release tag is created by the GitHub App, so a tag trigger
# would publish every release twice.
on:
  workflow_call:
    inputs:
      version:
        description: Version to publish, without the leading v.
        required: true
        type: string
      ref:
        description: Commit to build - the release commit.
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The release commit itself, from Release Please.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Read version
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$INPUT_VERSION"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' is not a release version"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reject an existing image tag
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/games-manager:${{ steps.meta.outputs.version }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" > "$RUNNER_TEMP/inspect" 2>&1; then
            echo "::error::$IMAGE already exists; refusing to replace a released image"
            exit 1
          fi
          grep -Eqi 'not found|manifest unknown|name unknown' "$RUNNER_TEMP/inspect" || {
            cat "$RUNNER_TEMP/inspect"
            echo "::error::could not verify whether $IMAGE exists"
            exit 1
          }

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/games-manager:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/games-manager:sha-${{ inputs.ref }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ inputs.ref }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: azure/setup-helm@v5.1.0
        with:
          version: v4.3.1

      - name: Package and push chart
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$REGISTRY_PASSWORD" | helm registry login ghcr.io -u "$REGISTRY_USER" --password-stdin
          helm package chart --version "$VERSION" --app-version "$VERSION" -d "$RUNNER_TEMP"
          helm push "$RUNNER_TEMP/games-manager-$VERSION.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"
