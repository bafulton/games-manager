name: Chart

# On main, Release Please calls this and releases only once it passes.
on:
  pull_request:
  workflow_call:

jobs:
  chart:
    name: Chart and image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # setup-go's cache is one entry shared by every job and saved by
          # whichever finishes first, so it never holds this job's
          # cross-compiled packages. This job keeps its own below.
          cache: false

      # Restored on every run; saved only from main, so pull requests reuse
      # main's build cache without paying to upload their own.
      - name: Restore Go build cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-chart-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-chart-${{ hashFiles('go.sum') }}-
            go-chart-

      - uses: azure/setup-helm@v5.1.0
        with:
          version: v4.3.1

      # The chart's CRDs and ClusterRole are copies of generated files, so
      # an API or RBAC change must come with `make chart`.
      - name: Chart is in sync with the API
        run: |
          make chart
          git diff --exit-code -- chart/ || {
            echo "::error::chart/ is out of date: run make chart and commit the result"
            exit 1
          }

      - name: Lint and render the chart
        run: |
          helm lint chart
          helm template games-manager chart --include-crds > /dev/null

      # Builds both architectures and pushes nothing, so a broken image
      # fails review instead of a release. The managers are cross-compiled
      # here, with this job's Go build cache, so the image build only copies
      # them in.
      - name: Cross-compile the manager
        run: make build-linux
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: false

      - name: Save Go build cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-chart-${{ hashFiles('go.sum') }}-${{ github.sha }}
