name: Chart

on:
  push:
    branches: [main]
  pull_request:

jobs:
  chart:
    name: Chart and image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: azure/setup-helm@v5.1.0
        with:
          version: v4.3.1

      # The chart's CRDs and ClusterRole are copies of generated files, so
      # an API or RBAC change must come with `make chart`.
      - name: Chart is in sync with the API
        run: |
          make chart
          git diff --exit-code -- chart/ || {
            echo "::error::chart/ is out of date: run make chart and commit the result"
            exit 1
          }

      - name: Lint and render the chart
        run: |
          helm lint chart
          helm template games-manager chart --include-crds > /dev/null

      # Builds both architectures and pushes nothing, so a broken image
      # fails review instead of a release.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
