# Minecraft Java, one hostname per server: alice.mc.example.com. A proxy
# that routes by the hostname the client sends lets every server share port
# 25565. This example uses mc-router (itzg/mc-router, run with
# --in-kube-cluster), which finds each server's Service by an annotation.
apiVersion: games.homelab.io/v1alpha1
kind: Game
metadata:
  name: minecraft
spec:
  # Multi-arch, and runs as uid 1000, so the default security contexts fit.
  image: itzg/minecraft-server:2026.10.1
  env:
    - name: EULA
      value: "TRUE"
    - name: TYPE
      value: PAPER
    # The image sizes the JVM heap from this, so keep it under the memory
    # limit with room for the JVM itself.
    - name: MEMORY
      value: 2G
  ports:
    - name: java
      containerPort: 25565
  connection:
    type: Hostname
    hostname:
      domain: mc.example.com
  service:
    annotations:
      mc-router.itzg.me/externalServerName: $(ADDRESS)
  sizes:
    - name: small
      resources:
        requests: {cpu: 500m, memory: 2560Mi}
        limits: {memory: 3Gi}
    - name: large
      resources:
        requests: {cpu: "1", memory: 4608Mi}
        limits: {memory: 5Gi}
  defaultSize: small
  # Each server stays on the version it was created with until its owner
  # changes spec.version. VERSION pins the server jar the image downloads;
  # without it, the image runs the latest release.
  versions:
    - name: "1.21"
      env:
        - name: VERSION
          value: 1.21.4
    # Older releases need an older Java, so this version swaps the image.
    - name: "1.20"
      image: itzg/minecraft-server:2026.10.1-java17
      env:
        - name: VERSION
          value: 1.20.4
  defaultVersion: "1.21"
  storage:
    size: 10Gi
    mountPath: /data
  # mc-health is part of the image: it pings the server like a client would.
  readinessProbe:
    exec:
      command: [mc-health]
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 30
  # Steer servers toward some nodes without ruling the others out, eg nodes
  # with spare memory. nodeSelector and tolerations are also available.
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 50
          preference:
            matchExpressions:
              - key: example.com/pool
                operator: In
                values: [games]
  # The image saves the world and stops cleanly on SIGTERM, so no preStop.
  terminationGracePeriodSeconds: 120
---
apiVersion: games.homelab.io/v1alpha1
kind: GameServer
metadata:
  name: alice
  namespace: games
spec:
  game: minecraft
  # Optional: the Game's defaultVersion is recorded here when left out.
  version: "1.21"
  owner: alice
  env:
    - name: MOTD
      value: Alice's world
